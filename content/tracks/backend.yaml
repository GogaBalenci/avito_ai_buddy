      help: { kind: explain, kb_doc: spt, source_level: playbook } }
  - { id: be-3.5, checklist_ref: "3.5", period: month1, order: 40, type: learn, owner: intern,
      title: "Изучи Zero Bug Policy (ZBP)",
      help: { kind: explain, kb_doc: zero-bug-policy, source_level: playbook } }
  - { id: be-3.7, checklist_ref: "3.7", period: month1, order: 50, type: learn, owner: intern,
      title: "Изучи информацию про API",
      help: { kind: track_only } }
  - { id: be-3.8, checklist_ref: "3.8", period: month1, order: 60, type: learn, owner: intern,
      title: "Изучи Effective Go",
      help: { kind: track_only } }
  - { id: be-3.2, checklist_ref: "3.2", period: month1, order: 70, type: learn, owner: intern,
      title: "Пройди курс «Микросервисная архитектура в Авито»",
      help: { kind: track_only } }
  - { id: be-3.3, checklist_ref: "3.3", period: month1, order: 80, type: setup, owner: intern,
      title: "Установи сниффер запросов (bruno или charles) и LENS для Kubernetes",
      help: { kind: explain, kb_doc: tool-sniffers, source_level: public } }
  - { id: be-3.6, checklist_ref: "3.6", period: month1, order: 90, type: tell, owner: intern,
      title: "Расскажи о Grafana",
      help: { kind: explain, kb_doc: tool-grafana, source_level: public } }

  # --- Месяц 2 ---
  - { id: be-4.1, checklist_ref: "4.1", period: month2, order: 10, type: learn, owner: intern,
      title: "Изучи демо Tech Platform",
      help: { kind: track_only } }
  - { id: be-4.2, checklist_ref: "4.2", period: month2, order: 20, type: learn, owner: intern,
      title: "Изучи документацию по нагрузочному тестированию",
      help: { kind: track_only } }
  - { id: be-4.3, checklist_ref: "4.3", period: month2, order: 30, type: learn, owner: intern,
      title: "Изучи инфомодель",
      help: { kind: explain, kb_doc: term-infomodel, source_level: none } }

  # --- Месяц 3 ---
  - { id: be-5.1, checklist_ref: "5.1", period: month3, order: 10, type: tell, owner: intern,
      title: "Расскажи о Redash",
      help: { kind: track_only } }
  - { id: be-5.2, checklist_ref: "5.2", period: month3, order: 20, type: learn, owner: intern,
      title: "Пройди курс «Паттерны и практики написания кода»",
      help: { kind: track_only } }
  - { id: be-5.3, checklist_ref: "5.3", period: month3, order: 30, type: meet, owner: intern,
      title: "Найди подходящее сообщество в Центре сообществ",
      help: { kind: track_only } }
  - { id: be-5.4, checklist_ref: "5.4", period: month3, order: 40, type: learn, owner: intern,
      title: "Познакомься с процессом планирования плановых работ на сервисах («Шаталити»)",
      help: { kind: track_only } }

  # --- После 3 месяцев ---
  - { id: be-6.7, checklist_ref: "6.7", period: after3, order: 50, type: learn, owner: intern,
      title: "Изучи рекомендованные книги по Go, микросервисам, алгоритмам и высоконагруженным системам",
      help: { kind: track_only } }

# Словарь намерений режима demo (09 §6.2). Обычные слова: загрузчик сам
# прогоняет их через тот же стеммер Snowball, что и вход.
# Веса — стартовые, зафиксированы тестами перефразировок и ложных срабатываний.
version: 1
threshold: 1.0
priority: [out_of_scope, time_off, access_request, step_done, step_explain,
           my_requests, my_path, ask_mentor, help]
# «не» за 1–2 содержательных токена до совпадения обнуляет его; после
# совпадения — только в связке «не нужен / не надо» (отгул мне пока не нужен).
negation: { words: [не, нет, без], window: 2, need_words: [нужен, нужна, нужно, нужны, надо] }
stop_words: [и, в, на, с, по, мне, меня, я, ты, а, ну, пожалуйста, можно, как, это, что, где, сколько, у, о, об, к, ко, мой, моя, мое, мои, моей, моего]
intents:
  out_of_scope:
    topics:
      salary:        { words: [зарплата, оклад, премия, выплата, аванс], weight: 2 }
      vacation:      { words: [отпуск, отпускные], weight: 2 }
      sick_leave:    { words: [больничный, заболел, заболела, болею, температура], weight: 2 }
      business_trip: { words: [командировка], weight: 2 }
      hiring:        { words: [найм, вакансия, собеседование], weight: 2 }
      dismissal:     { words: [увольнение, уволиться], weight: 2 }
      benefits:      { words: [дмс, бенефиты, компенсация, страховка], weight: 2 }
      evaluation:    { phrases: ["моя оценка", "оценка стажера", "оценят меня", "ревью компетенций", "аттестация", "обратная связь обо мне"], weight: 2 }
      wellbeing:     { words: [выгорел, выгорела, выгорание, тревожно], phrases: ["не справляюсь"], weight: 2 }
      # Чужие ПДн (09 §11.2, §17.5): фразы + пара «контакт → человек» («телефон моего наставника»).
      personal_data:
        phrases: ["телефон коллеги", "адрес сотрудника", "паспорт сотрудника", "номер телефона"]
        pairs:
          - { first: [телефон, номер, почта, почту, email, мейл, имейл, емейл, контакты, контакт, телеграм, телеграмм, тг, telegram, мобильный, адрес],
              second: [наставник, наставника, ментор, коллега, коллеги, руководитель, руководителя, тимлид, сотрудник, сотрудника, начальник, hr], gap: 2 }
        weight: 2
      # Подмена роли или правил через сообщение (09 §17.4): важнее модели, как sick_leave.
      role_change:
        phrases: ["я наставник", "я наставница", "я ментор", "я админ", "я администратор", "я теперь наставник",
                  "ты теперь наставник", "ты теперь ментор", "ты теперь админ", "теперь ты наставник",
                  "режим разработчика", "системный промпт", "system prompt", "developer mode"]
        pairs:
          - { first: [забудь, забыть, игнорируй, игнорировать, проигнорируй, ignore, forget],
              second: [инструкции, инструкцию, правила, промпт, ограничения, указания, instructions, rules, prompt], gap: 2 }
          - { first: [покажи, выведи, напиши, show, print], second: [промпт, prompt], gap: 2 }
        weight: 2
  time_off:
    words:   { отгул: 2, отпроситься: 2, отпрошусь: 2 }
    phrases: { "взять выходной": 2, "взять день": 1.5, "не выйду": 1, "на экзамен": 0.5, "на сессию": 0.5 }
  access_request:
    words:   { доступ: 1.5, канал: 0.5, чат: 0.5, пространство: 0.5, репозиторий: 0.5 }
    phrases: { "добавь меня": 1.5, "добавить меня": 1.5, "запросить доступ": 2, "дай доступ": 2 }
    resource_alias_bonus: 1.5
    access_verbs: [доступ, добавь меня, добавить меня, дай доступ, запросить доступ, подключи, вступить]
  step_done:
    phrases: { "я сделал": 2, "я сделала": 2, "я прошел": 2, "я прошла": 2, "я настроил": 2, "я настроила": 2, "я изучил": 2, "я изучила": 2, "я познакомился": 2, "я познакомилась": 2, "готово": 1, "отметь": 1 }
    requires: [step_ref_or_step_title]
  step_explain:
    phrases: { "что значит шаг": 2, "объясни шаг": 2, "как сделать шаг": 2 }
    step_ref_bonus: 1
  my_requests:
    words:   { заявка: 1.5, одобрили: 1.5 }
    phrases: { "статус заявки": 2, "что с заявкой": 2 }
  my_path:
    phrases: { "что дальше": 2, "что мне делать": 2, "что делать дальше": 2, "следующий шаг": 2, "мой путь": 2, "мой прогресс": 2, "какой этап": 2, "какой у меня прогресс": 2 }
  ask_mentor:
    words:   { наставник: 0.5, ментор: 0.5 }
    phrases: { "спросить наставника": 2, "написать наставнику": 2, "вопрос наставнику": 2, "связаться с наставником": 2 }
  help:
    words:   { помощь: 1 }
    phrases: { "что умеешь": 2, "что ты можешь": 2 }
# Болтовня (09 §17.3): тема small_talk:<вид> намерения help с самым низким
# приоритетом — только если ни одно намерение не набрало порог и непокрытых
# содержательных слов не больше max_uncovered. Ответ — шаблон, без модели.
small_talk:
  max_uncovered: 1
  order: [how_are_you, who_are_you, joke, music, likes, compliment, thanks, bye, greeting]
  ignore: [витя, витек, витюша, вить, авиитик, бадди, слушай, кстати, или, тебя, тебе, твой, твоя, твое, твои, какой, какая, какое, какую, какие, же, вообще]
  kinds:
    how_are_you:
      words:   [поживаешь]
      phrases: ["как дела", "как ты", "как жизнь", "как настроение", "как сам", "что нового", "как твои дела", "как день"]
    who_are_you:
      phrases: ["ты кто", "кто ты", "кто такой", "ты бот", "ты робот", "ты человек", "ты живой", "ты нейросеть", "ты ии", "как тебя зовут", "ты настоящий"]
    joke:
      words:   [шутка, пошути, анекдот, рассмеши, шутку, анекдоты, шутки]
    music:
      words:   [музыка, музыку, песни, песня, плейлист, слушаешь, музыкой]
    likes:
      words:   [любишь, хобби, увлекаешься, нравится]
      phrases: ["любимая еда", "любимое занятие", "что ты ешь"]
    compliment:
      words:   [молодец, умница, классный, клевый, лучший, милый, милашка, крутой, симпатичный, супер]
    thanks:
      words:   [спасибо, благодарю, спс, спасибочки, thanks, мерси, благодарочка]
    bye:
      words:   [увидимся, бывай]
      phrases: ["до свидания", "до встречи", "до завтра", "хорошего дня", "хорошего вечера", "спокойной ночи"]
      edge_words: [пока]
    greeting:
      words:   [привет, здравствуй, здравствуйте, приветик, хай, hello, hi, салют, здорово, прив]
      phrases: ["добрый день", "доброе утро", "добрый вечер", "доброй ночи"]

# CI runs the same commands as README (12 §12): green CI proves the instructions work.
# C0: lint + full stack up with healthchecks + smoke stub + Go tests.
# Added later: tsc/eslint, codegen diff, openspec validate (lint); coverage gates (test).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # latest v2: a pinned old release may refuse to lint code for a newer Go
          version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Front-end lint, types, generated API types
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run gen
          git diff --exit-code src/shared/api/schema.gen.ts
      - name: OpenSpec (specs before code)
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx -y @fission-ai/openspec@1.17.0 validate --all --strict --no-interactive

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Go tests and coverage
        run: docker compose --profile test run --rm test-go
      - name: Front-end tests
        run: docker compose --profile test run --rm test-web
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo "- Go app: $(tail -1 coverage/go-app.txt | awk '{print $NF}')"
            echo "- Go mocks (reference): $(tail -1 coverage/go-mocks.txt | awk '{print $NF}')"
            node -e "const s=require('./web/coverage/coverage-summary.json').total;console.log('- Web: lines '+s.lines.pct+'%, statements '+s.statements.pct+'%, functions '+s.functions.pct+'%, branches '+s.branches.pct+'%')"
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            web/coverage/
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: docker compose --profile test down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start stack (same command as README)
        run: docker compose up --build --wait --wait-timeout 300
      - name: Status
        run: docker compose ps
      - name: Smoke
        run: docker compose --profile test run --rm smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Stop
        if: always()
        run: docker compose --profile test down -v
